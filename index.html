<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セミナー＆参加者ノート</title>
    <style>
        :root {
            --bg-color: #fcfaf2;
            --card-bg: #ffffff;
            --text-color: #5c5346;
            --primary-color: #e8a87c;
            --secondary-color: #c38d9e;
            --accent-color: #85cdca;
            --border-color: #e3dec3;
            --delete-color: #e8a5a5;
            --export-color: #93b5c6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 15px;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.6rem;
            color: #7c6f59;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 2px dashed var(--secondary-color);
            padding-bottom: 10px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--border-color);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .card-header-flex h2 {
            margin-bottom: 0;
        }

        h2 {
            font-size: 1.15rem;
            margin-top: 0;
            color: var(--secondary-color);
            border-left: 5px solid var(--accent-color);
            padding-left: 10px;
        }

        .collapsible-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .collapsible-header:hover {
            opacity: 0.8;
        }

        .toggle-icon {
            font-size: 0.95rem;
            color: var(--secondary-color);
        }

        .form-body {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fffdf9;
            box-sizing: border-box;
            font-size: 1rem;
            color: var(--text-color);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px #b57a52;
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 10px;
            box-shadow: 1px 1px 0px rgba(0,0,0,0.2);
            margin-left: 4px;
            margin-bottom: 4px;
        }

        .btn-edit {
            background-color: var(--accent-color);
        }

        .btn-delete {
            background-color: var(--delete-color);
        }

        .btn-export {
            background-color: var(--export-color);
            box-shadow: 2px 2px 0px #608090;
        }

        .btn-import {
            background-color: #b5c18e;
            box-shadow: 2px 2px 0px #85965e;
        }

        .seminar-item {
            background: #fffdfa;
            border: 1px dashed var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .seminar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .participant-list {
            margin-top: 10px;
            padding-left: 0;
            font-size: 0.95rem;
        }

        .participant-item {
            margin-bottom: 10px;
            background: #f7f5ee;
            padding: 12px;
            border-radius: 8px;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .customer-item {
            background: #f7f5ee;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }

        .customer-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .customer-history-box {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.88rem;
            color: #666;
        }

        .history-tag {
            display: inline-block;
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 3px 4px 3px 0;
            color: #5c5346;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
            background: var(--accent-color);
            color: white;
            margin-right: 5px;
        }

        .data-management-box {
            background: #f7f5ee;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .row-inputs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .row-inputs > div {
            flex: 1;
            min-width: 200px;
        }

        .birthdate-input-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .birthdate-mode-switch {
            font-size: 0.85rem;
            color: var(--secondary-color);
            cursor: pointer;
            text-align: right;
            margin-bottom: 2px;
        }
        .birthdate-mode-switch:hover {
            text-decoration: underline;
        }
        .wareki-inputs {
            display: flex;
            gap: 5px;
        }
        .wareki-inputs select {
            flex: 1.2;
        }
        .wareki-inputs input {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 セミナー＆参加者ノート</h1>

    <!-- セミナー登録カード -->
    <div class="card">
        <div class="collapsible-header" onclick="toggleForm('seminarFormBody', 'seminarToggleIcon')">
            <h2 id="seminarFormTitle" style="margin: 0; border: none; padding: 0;">➕ 新しいセミナーを登録する</h2>
            <span id="seminarToggleIcon" class="toggle-icon">▶ 開く</span>
        </div>
        <div id="seminarFormBody" class="form-body">
            <input type="hidden" id="editSeminarIndex" value="">
            
            <div class="form-group" style="margin-top: 10px; background: #fdfaf3; padding: 12px; border-radius: 8px; border: 1px dashed var(--border-color);">
                <label style="color: var(--secondary-color); margin-bottom: 8px;">✨ 既存のセミナー名から選ぶ場合：</label>
                <select id="existingSeminarSelect" onchange="fillSeminarTitleFromSelect()">
                    <option value="">-- 登録済みセミナー名から選択（任意） --</option>
                </select>
            </div>

            <div class="form-group">
                <label>セミナー名：</label>
                <input type="text" id="seminarTitle" placeholder="例：春のおしゃれ手帳術（直接入力もOK）">
            </div>
            <div class="form-group">
                <label>日時：</label>
                <input type="date" id="seminarDate">
            </div>
            <div class="form-group">
                <label>AM・PMの選択：</label>
                <select id="seminarTimeSlot">
                    <option value="AM（10:00～12:00）">AM（10:00～12:00）</option>
                    <option value="PM（14:00～16:00）">PM（14:00～16:00）</option>
                    <option value="終日">終日</option>
                </select>
            </div>
            <button id="seminarSubmitBtn" onclick="saveSeminar()">セミナーを登録する ✨</button>
            <button id="seminarCancelBtn" onclick="resetSeminarForm(); toggleForm('seminarFormBody', 'seminarToggleIcon');" style="background-color:#bbb; display:none;">キャンセル</button>
        </div>
    </div>

    <!-- 顧客リスト（マスタ）カード -->
    <div class="card">
        <div class="collapsible-header" onclick="toggleForm('customerFormBody', 'customerToggleIcon')">
            <h2 id="customerFormTitle" style="margin: 0; border: none; padding: 0;">👥 顧客リスト（マスタ登録）</h2>
            <span id="customerToggleIcon" class="toggle-icon">▶ 開く</span>
        </div>
        <div id="customerFormBody" class="form-body">
            <p style="font-size:0.9rem; color:#777; margin-top:0;">常連様やリピーターの情報をあらかじめ登録しておくと、参加者追加時に連動します。</p>
            <input type="hidden" id="editCustomerId" value="">
            
            <div class="form-group row-inputs">
                <div>
                    <label>お名前：</label>
                    <input type="text" id="cName" placeholder="例：山田 花子">
                </div>
                <div>
                    <label>ふりがな：</label>
                    <input type="text" id="cFurigana" placeholder="例：やまだ はなこ">
                </div>
            </div>

            <div class="form-group row-inputs">
                <div>
                    <label>メール：</label>
                    <input type="email" id="cEmail" placeholder="例：example@email.com">
                </div>
                <div>
                    <label>生年月日：</label>
                    <div class="birthdate-input-container">
                        <div class="birthdate-mode-switch" id="cBirthdateSwitch" onclick="toggleBirthdateMode('c')">🔄 和暦で入力するに切り替え</div>
                        <input type="date" id="cBirthdate" onchange="syncBirthdateInput('c', 'seireki')">
                        <div id="cWarekiContainer" class="wareki-inputs" style="display: none;">
                            <select id="cEra" onchange="syncBirthdateInput('c', 'wareki')">
                                <option value="令和">令和</option>
                                <option value="平成">平成</option>
                                <option value="昭和" selected>昭和</option>
                                <option value="大正">大正</option>
                                <option value="明治">明治</option>
                            </select>
                            <input type="number" id="cEraYear" placeholder="年" min="1" max="99" value="55" oninput="syncBirthdateInput('c', 'wareki')">
                            <select id="cEraMonth" onchange="syncBirthdateInput('c', 'wareki')">
                                <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                                <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
                                <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                                <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                            </select>
                            <select id="cEraDay" onchange="syncBirthdateInput('c', 'wareki')">
                                <option value="1">1日</option><option value="2">2日</option><option value="3">3日</option>
                                <option value="4">4日</option><option value="5">5日</option><option value="6">6日</option>
                                <option value="7">7日</option><option value="8">8日</option><option value="9">9日</option>
                                <option value="10">10日</option><option value="11">11日</option><option value="12">12日</option>
                                <option value="13">13日</option><option value="14">14日</option><option value="15">15日</option>
                                <option value="16">16日</option><option value="17">17日</option><option value="18">18日</option>
                                <option value="19">19日</option><option value="20">20日</option><option value="21">21日</option>
                                <option value="22">22日</option><option value="23">23日</option><option value="24">24日</option>
                                <option value="25">25日</option><option value="26">26日</option><option value="27">27日</option>
                                <option value="28">28日</option><option value="29">29日</option><option value="30">30日</option><option value="31">31日</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Instagramアカウント（ID）：</label>
                <input type="text" id="cInstaId" placeholder="例：hanako_gram">
            </div>
            <div class="form-group">
                <label>Instagramハンドルネーム（表示名）：</label>
                <input type="text" id="cInstaName" placeholder="例：はなこ｜丁寧な暮らし">
            </div>
            <div class="form-group">
                <label>出身：</label>
                <input type="text" id="cFrom" placeholder="例：東京都">
            </div>
            <div class="form-group">
                <label>性別：</label>
                <select id="cGender">
                    <option value="女性">女性</option>
                    <option value="男性">男性</option>
                    <option value="その他・未回答">その他・未回答</option>
                </select>
            </div>
            <div class="form-group">
                <label>備考・メモ（マスタ共通）：</label>
                <textarea id="cMemo" placeholder="特記事項など..."></textarea>
            </div>
            <button id="customerSubmitBtn" onclick="saveCustomer()">顧客を登録する 💾</button>
            <button id="customerCancelBtn" onclick="resetCustomerForm()" style="background-color:#bbb; display:none;">キャンセル</button>

            <!-- 顧客マスタ専用のエクスポート・インポート機能 -->
            <div class="data-management-box">
                <div>
                    <strong>📁 顧客マスタデータのバックアップと復元</strong>
                    <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #777;">顧客リストのみをファイルに保存したり、読み込むことができます。</p>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                    <button class="btn-export" onclick="exportCustomers()">💾 マスタを保存</button>
                    <div class="import-wrapper">
                        <input type="file" id="importCustomerFile" accept=".json" style="display: none;" onchange="importCustomers(event)">
                        <button class="btn-import" onclick="document.getElementById('importCustomerFile').click()">📂 マスタを読込</button>
                    </div>
                </div>
            </div>

            <!-- 登録済み顧客の一覧表示 ＆ 検索機能 -->
            <div style="margin-top: 20px; border-top: 1px dashed var(--border-color); padding-top: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
                    <p style="font-size: 0.95rem; font-weight: bold; margin: 0;">登録済み顧客一覧 (<span id="customerCount">0</span>名)</p>
                </div>
                <div class="form-group" style="margin-bottom: 10px;">
                    <input type="text" id="customerSearchInput" placeholder="🔍 キーワードで検索（名前、ふりがな、メール、参加履歴など）" oninput="renderCustomerList()">
                </div>
                <div id="customerListContainer" style="max-height: 350px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- 参加者登録カード -->
    <div class="card">
        <div class="collapsible-header" onclick="toggleForm('participantFormBody', 'participantToggleIcon')">
            <h2 id="participantFormTitle" style="margin: 0; border: none; padding: 0;">➕ 参加者を登録する</h2>
            <span id="participantToggleIcon" class="toggle-icon">▶ 開く</span>
        </div>
        <div id="participantFormBody" class="form-body">
            <div class="form-group" style="margin-top: 10px; background: #fdfaf3; padding: 12px; border-radius: 8px; border: 1px dashed var(--border-color);">
                <label style="color: var(--secondary-color); margin-bottom: 8px;">✨ 顧客リストから選んで登録する：</label>
                <div style="margin-bottom: 8px;">
                    <input type="text" id="participantCustomerSearch" placeholder="🔍 顧客をキーワード検索して絞り込む..." oninput="updateQuickCustomerSelect()">
                </div>
                <select id="quickCustomerSelect">
                    <option value="">-- 顧客リストから選択 --</option>
                </select>
            </div>

            <div class="form-group">
                <label>登録するセミナーを選択：</label>
                <select id="targetSeminarSelect"></select>
            </div>
            
            <div class="form-group">
                <label>個別メモ（このセミナーだけの特記事項があれば）：</label>
                <textarea id="pMemo" placeholder="例：事前アンケート回答内容など..."></textarea>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <button id="participantSubmitBtn" onclick="saveParticipant()">選択した顧客をセミナーに参加させる ✍️️</button>
                <button id="participantCancelBtn" onclick="resetParticipantForm(); toggleForm('participantFormBody', 'participantToggleIcon');" style="background-color:#bbb; display:none;">キャンセル</button>
            </div>
        </div>
    </div>

    <!-- 登録一覧カード -->
    <div class="card">
        <div class="card-header-flex">
            <h2>📖 セミナー＆参加者ノート一覧</h2>
        </div>

        <div class="data-management-box">
            <div>
                <strong>📁 全体データのバックアップと復元</strong>
                <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: #777;">すべてのセミナーと顧客データをまとめて保存・復元できます。</p>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                <button class="btn-export" onclick="exportData()">💾 全体保存</button>
                <div class="import-wrapper">
                    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
                    <button class="btn-import" onclick="document.getElementById('importFile').click()">📂 全体読込</button>
                </div>
            </div>
        </div>

        <div id="seminarListContainer" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    let seminars = JSON.parse(localStorage.getItem('seminars')) || [];
    let customers = JSON.parse(localStorage.getItem('customers')) || [];
    let birthdateModes = { c: 'seireki' };

    const eraBaseYears = { '明治': 1868, '大正': 1912, '昭和': 1926, '平成': 1989, '令和': 2019 };

    function migrateOldData() {
        let modified = false;
        seminars.forEach(seminar => {
            if (seminar.participants) {
                seminar.participants = seminar.participants.map(p => {
                    if (p.customerId) return p;
                    let foundCustomer = customers.find(c => c.name === p.name);
                    let cId;
                    if (foundCustomer) {
                        cId = foundCustomer.id;
                    } else {
                        cId = 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        customers.push({
                            id: cId,
                            name: p.name || '名前なし',
                            furigana: p.furigana || '',
                            email: p.email || '',
                            birthdate: p.birthdate || '',
                            instaId: p.instaId || '未設定',
                            instaName: p.instaName || p.instaId || '名前なし',
                            from: p.from || '',
                            gender: p.gender || '女性',
                            memo: p.memo || ''
                        });
                        modified = true;
                    }
                    return { customerId: cId, memo: p.memo || '' };
                });
            }
        });
        customers = customers.map(c => {
            if (!c.id) {
                modified = true;
                return { ...c, id: 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5) };
            }
            return c;
        });
        if (modified) {
            localStorage.setItem('seminars', JSON.stringify(seminars));
            localStorage.setItem('customers', JSON.stringify(customers));
        }
    }
    migrateOldData();

    function convertToWareki(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length !== 3) return dateString;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10);
        const d = parseInt(parts[2], 10);
        const targetDateNum = y * 10000 + m * 100 + d;

        let selectedEra = '西暦';
        let eraYear = y;

        if (targetDateNum >= 20190501) { selectedEra = '令和'; eraYear = y - 2019 + 1; }
        else if (targetDateNum >= 19890108) { selectedEra = '平成'; eraYear = y - 1989 + 1; }
        else if (targetDateNum >= 19261225) { selectedEra = '昭和'; eraYear = y - 1926 + 1; }
        else if (targetDateNum >= 19120730) { selectedEra = '大正'; eraYear = y - 1912 + 1; }
        else if (targetDateNum >= 18680908) { selectedEra = '明治'; eraYear = y - 1868 + 1; }

        const eraYearStr = eraYear === 1 ? '元' : eraYear;
        return `${selectedEra}${eraYearStr}年${m}月${d}日`;
    }

    function convertWarekiToSeireki(prefix) {
        const era = document.getElementById(prefix + 'Era').value;
        const eraYearVal = parseInt(document.getElementById(prefix + 'EraYear').value, 10);
        const month = document.getElementById(prefix + 'EraMonth').value;
        const day = document.getElementById(prefix + 'EraDay').value;
        if (isNaN(eraYearVal) || eraYearVal < 1) return '';
        const seirekiYear = eraBaseYears[era] + eraYearVal - 1;
        return `${seirekiYear}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function setWarekiFromSeireki(prefix, dateString) {
        if (!dateString) return;
        const parts = dateString.split('-');
        if (parts.length !== 3) return;
        const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
        const targetDateNum = y * 10000 + m * 100 + d;
        let selectedEra = '昭和', eraYear = 55;
        if (targetDateNum >= 20190501) { selectedEra = '令和'; eraYear = y - 2019 + 1; }
        else if (targetDateNum >= 19890108) { selectedEra = '平成'; eraYear = y - 1989 + 1; }
        else if (targetDateNum >= 19261225) { selectedEra = '昭和'; eraYear = y - 1926 + 1; }
        else if (targetDateNum >= 19120730) { selectedEra = '大正'; eraYear = y - 1912 + 1; }
        else if (targetDateNum >= 18680908) { selectedEra = '明治'; eraYear = y - 1868 + 1; }
        document.getElementById(prefix + 'Era').value = selectedEra;
        document.getElementById(prefix + 'EraYear').value = eraYear;
        document.getElementById(prefix + 'EraMonth').value = m;
        document.getElementById(prefix + 'EraDay').value = d;
    }

    function toggleBirthdateMode(prefix) {
        const currentMode = birthdateModes[prefix];
        const seirekiInput = document.getElementById(prefix + 'Birthdate');
        const warekiContainer = document.getElementById(prefix + 'WarekiContainer');
        const switchBtn = document.getElementById(prefix + 'BirthdateSwitch');
        if (currentMode === 'seireki') {

            seirekiInput.style.display = 'none';
            warekiContainer.style.display = 'flex';
            switchBtn.textContent = '🔄 西暦で入力するに切り替え';
            birthdateModes[prefix] = 'wareki';
        } else {
            const seirekiVal = convertWarekiToSeireki(prefix);
            if (seirekiVal) seirekiInput.value = seirekiVal;
            warekiContainer.style.display = 'none';
            seirekiInput.style.display = 'block';
            switchBtn.textContent = '🔄 和暦で入力するに切り替え';
            birthdateModes[prefix] = 'seireki';
        }

    function syncBirthdateInput(prefix, source) {
        if (source === 'wareki') {
            document.getElementById(prefix + 'Birthdate').value = convertWarekiToSeireki(prefix);
        }

    function getBirthdateValue(prefix) {
        return birthdateModes[prefix] === 'wareki' ? convertWarekiToSeireki(prefix) : document.getElementById(prefix + 'Birthdate').value;
    }

    function setBirthdateValue(prefix, dateString) {
        document.getElementById(prefix + 'Birthdate').value = dateString || '';
        if (birthdateModes[prefix] === 'wareki' && dateString) setWarekiFromSeireki(prefix, dateString);
    }

    function formatDateWithDay(dateString) {
        if (!dateString) return '';
        const dateObj = new Date(dateString.replace(/-/g, '/'));
        if (isNaN(dateObj)) return dateString;
        const days = ['㈰', '㈪', '㈫', '㈬', '㈭', '㈮', '㈯'];
        return `${dateString}${days[dateObj.getDay()]}`;
    }

    function calculateAge(birthdateString) {
        if (!birthdateString) return null;
        const birthDate = new Date(birthdateString);
        if (isNaN(birthDate)) return null;
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
        return age >= 0 ? age : null;
    }

    function getTimeSlotWeight(timeSlot) {
        if (timeSlot && timeSlot.includes('AM')) return 1;
        if (timeSlot && timeSlot.includes('PM')) return 2;
        return 3;
    }

        } else {

    }

    function getCustomerSeminarHistory(customerId) {
        let history = [];
        seminars.forEach(s => {
            if (s.participants) {
                s.participants.forEach(p => {
                    if (p.customerId === customerId) {
                        history.push({ title: s.title, date: s.date, timeSlot: s.timeSlot, memo: p.memo });
                    }
                });
            }
        });
        history.sort((a, b) => b.date.localeCompare(a.date));
        return history;
    }

    // 顧客マスタ専用のインポート
    function importCustomers(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                const importedCustomers = Array.isArray(imported) ? imported : (imported.customers || []);
                if (importedCustomers.length === 0) {
                    alert('有効な顧客データが見つかりませんでした。');
                    return;
                }
                
                let mode = confirm('既存の顧客データに「追加（マージ）」しますか？\n\n[OK] = 追加する\n[キャンセル] = 既存データをすべて上書きして置き換える');
                
                if (mode) {
                    let addedCount = 0;
                    importedCustomers.forEach(imp => {
                        if (!imp.id) imp.id = 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        let idx = customers.findIndex(c => c.id === imp.id || (c.name && c.name === imp.name && c.email && c.email === imp.email));
                        if (idx !== -1) {
                            customers[idx] = imp;
                        } else {
                            customers.push(imp);
                            addedCount++;
                        }
                    });
                    alert(`顧客マスタを統合しました！（新規追加: ${addedCount}件）`);
                } else {
                    customers = importedCustomers.map(c => {
                        if (!c.id) c.id = 'cust_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                        return c;
                    });
                    alert('顧客マスタを置き換えました！');
                }
                
                saveAndRefresh();
            } catch (error) {
                alert('JSONファイルの読み込みに失敗しました。');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

        if (sIndex === "") { alert('登録先のセミナーを選択してください。'); return; }
        const customerId = document.getElementById('quickCustomerSelect').value;
        if (!customerId) { alert('顧客リストから参加者を選択してください。'); return; }
        if (seminars[sIndex].participants.some(p => p.customerId === customerId)) {
            alert('この顧客はすでにこのセミナーに参加登録されています。');
            return;
        }
        seminars[sIndex].participants.push({ customerId, memo: document.getElementById('pMemo').value.trim() });
        alert('参加者を登録しました！');
        resetParticipantForm();
        toggleForm('participantFormBody', 'participantToggleIcon');
        saveAndRefresh();
    }

    function resetParticipantForm() {
        document.getElementById('participantCustomerSearch').value = '';
        document.getElementById('quickCustomerSelect').value = '';
        updateQuickCustomerSelect();
        document.getElementById('pMemo').value = '';
        document.getElementById('participantFormTitle').textContent = '➕ 参加者を登録する';
        document.getElementById('participantSubmitBtn').textContent = '選択した顧客をセミナーに参加させる ✍️️';
        document.getElementById('participantCancelBtn').style.display = 'none';
    }

    function deleteParticipant(sIndex, pIndex) {
        if (confirm('この参加者をセミナーから外しますか？')) {
            seminars[sIndex].participants.splice(pIndex, 1);
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('seminars', JSON.stringify(seminars));
        localStorage.setItem('customers', JSON.stringify(customers));
        renderApp();
    }

    renderApp();
</script>

</body>
</html>
